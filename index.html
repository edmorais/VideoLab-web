<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Videolab</title>
<meta name="description" content="Videolab — a hands-on simulator of digital video: resolution, frame rate, aspect ratio, interlacing, chroma sampling and colour depth.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Share+Tech+Mono&family=VT323&display=swap">
<style>
/* Layout: a broadcast monitor sitting on a DVCAM-style deck; the deck is a grid of
   printed-label control groups that reflows from one rack row to a single column. */
:root {
  color-scheme: dark;
  /* room + housings */
  --room: #0d0e0f;
  --room-hi: #24272a;
  --body: #2e3134;
  --body-hi: #3f4347;
  --body-lo: #202224;
  --recess: #17191a;
  /* printed ink + keys */
  --ink: #eceef0;
  --ink-dim: #9aa0a6;
  --ink-faint: #5d6267;
  --key-hi: #e7e9eb;
  --key: #c6c9cd;
  --key-lo: #a9adb2;
  --key-ink: #1d1f22;
  /* lights */
  --vfd: #74f5e2;
  --vfd-off: rgba(116, 245, 226, .13);
  --vfd-bg: #041210;
  --red: #ff3b2f;
  --green: #45f06c;
  /* lab accents (from the 2013 help screens) */
  --a-intro: #eceef0;
  --a-res: #ff9f43;
  --a-fps: #ff5d73;
  --a-aspect: #3fe0f0;
  --a-interlace: #ffe14a;
  --a-sampling: #ff52e5;
  --a-depth: #58ff74;
  --acc: var(--a-intro);
  /* type */
  --f-label: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-osd: "VT323", "Courier New", monospace;
  --f-vfd: "Share Tech Mono", "Consolas", "Courier New", monospace;
}
html, body { height: 100%; background: var(--room); }
body { color: var(--ink); font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.room {
  min-height: 100%;
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 20px 40px;
  background:
    radial-gradient(90% 60% at 50% 0%, var(--room-hi) 0%, transparent 70%),
    var(--room);
}
.app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0; }

/* ---------- MONITOR ---------- */
.monitor {
  --m: 16 / 9; --mn: 1.7778;
  width: min(100%, max(480px, calc((100dvh - 500px) * var(--mn) + 56px)));
  box-sizing: border-box;
  padding: 16px 16px 0;
  border-radius: 16px 16px 6px 6px;
  background: linear-gradient(180deg, #44484c 0%, #35383b 8%, #2c2f32 70%, #26282a 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.5), 0 30px 60px -20px rgba(0,0,0,.8);
  transition: width .45s ease;
  position: relative; z-index: 1;
}
.monitor.is43 { --m: 4 / 3; --mn: 1.3333; }
.bezel {
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(180deg, #121314, #1b1d1f);
  box-shadow: inset 0 3px 10px rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.08);
}
.screen {
  position: relative; aspect-ratio: var(--m); max-width: 100%;
  margin: 0 auto; background: #000; border-radius: 6px; overflow: hidden;
  cursor: crosshair; touch-action: none;
  container-type: size;
  transition: aspect-ratio .45s ease;
}
.screen.zoomed { cursor: grab; }
.screen.dragging { cursor: grabbing; }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glass {
  position: absolute; inset: 0; pointer-events: none; border-radius: 6px;
  background:
    radial-gradient(120% 90% at 20% 0%, rgba(255,255,255,.07) 0%, transparent 45%),
    radial-gradient(140% 140% at 50% 50%, transparent 62%, rgba(0,0,0,.45) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
}
.osd {
  position: absolute; inset: 0; pointer-events: none;
  padding: 3.2% 4%;
  font-family: var(--f-osd); color: var(--acc);
  font-size: clamp(10px, 5.4cqh, 26px); line-height: 1;
  text-shadow: 2px 2px 0 rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9);
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto;
}
.osd[hidden] { display: none !important; }
.osd-tl { grid-column: 1; grid-row: 1; display: grid; justify-items: start; gap: 1px; min-width: 0; }
.osd-tr { grid-column: 2; grid-row: 1; display: grid; justify-items: end; gap: 1px; color: #f4f6f7; }
.osd-bl { grid-column: 1 / -1; grid-row: 3; display: grid; justify-items: start; color: #f4f6f7; min-width: 0; }
.osd i { font-style: normal; background: rgba(0,0,0,.58); padding: 0 .3em; white-space: pre; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.osd i.t { color: var(--acc); }
.osd i.w { color: #f4f6f7; }
.osd-tl i { color: color-mix(in srgb, var(--acc) 55%, #fff); }
.osd-msg {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(86%, 30em); text-align: center; color: #fff; white-space: normal;
  background: rgba(0,0,0,.72); padding: .5em .8em; line-height: 1.05;
  box-shadow: 0 0 0 2px rgba(255,255,255,.18);
}
.osd-msg strong { display: block; font-weight: normal; color: var(--acc); font-size: 1.3em; margin-bottom: .2em; }
.monitor-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 6px 12px;
}
.badge { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.wordmark { font: italic 700 19px/1 var(--f-label); letter-spacing: .01em; color: var(--ink); }
.model { font: 600 10px/1 var(--f-label); letter-spacing: .16em; color: var(--ink-dim); white-space: nowrap; }
.mon-right { display: flex; align-items: center; gap: 14px; }
.mon-ctl { display: flex; gap: 6px; align-items: center; }
.leds { display: flex; gap: 10px; align-items: center; font: 600 9px/1 var(--f-label); letter-spacing: .14em; color: var(--ink-dim); }
.leds span { display: inline-flex; align-items: center; gap: 5px; }
.lamp { width: 7px; height: 7px; border-radius: 50%; background: #2a1f1e; box-shadow: inset 0 1px 1px rgba(0,0,0,.7); display: inline-block; }
.lamp.power.on { background: var(--green); box-shadow: 0 0 6px var(--green), 0 0 2px var(--green); }
.lamp.tally.on { background: var(--red); box-shadow: 0 0 8px var(--red), 0 0 2px var(--red); }

/* monitor stand */
.stand {
  width: min(42%, 300px); height: 14px; margin-top: -1px;
  background: linear-gradient(180deg, #1c1e20, #2a2c2f);
  clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
}

/* ---------- DECK ---------- */
.deck {
  width: 100%; box-sizing: border-box;
  border-radius: 10px;
  padding: 14px 18px 18px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--body-hi) 0%, var(--body) 10%, var(--body) 75%, var(--body-lo) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.45), 0 24px 50px -18px rgba(0,0,0,.85);
  display: grid; gap: 14px 22px;
  grid-template-columns: auto minmax(240px, 1fr) auto auto;
  grid-template-areas:
    "top   top   top   top"
    "src   vfd   trans disp"
    "modes modes modes modes"
    "panel panel panel panel";
  position: relative;
}
.deck.dragover { box-shadow: inset 0 0 0 2px var(--vfd), 0 24px 50px -18px rgba(0,0,0,.85); }
.deck-top { grid-area: top; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .wordmark { font-size: 24px; }
.chips { display: inline-grid; grid-template-columns: repeat(6, 7px); gap: 2px; }
.chips i { height: 12px; display: block; border-radius: 1px; }
.brand .model { font-size: 10.5px; }
.cassette {
  flex: 1 1 280px; max-width: 460px; min-width: 0;
  display: grid; gap: 5px; padding: 8px 12px 7px; cursor: pointer;
  background: linear-gradient(180deg, #232527, #1a1c1e);
  border: 1px solid #0f1011; border-radius: 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.05);
  text-align: left;
}
.cassette .slot { height: 8px; border-radius: 4px; background: linear-gradient(180deg, #050505, #141516); box-shadow: inset 0 2px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.07); }
.cassette .clbl { display: flex; justify-content: space-between; gap: 8px; font: 600 9.5px/1 var(--f-label); letter-spacing: .16em; color: var(--ink-dim); white-space: nowrap; overflow: hidden; }
.cassette:hover .slot { box-shadow: inset 0 2px 3px rgba(0,0,0,.9), 0 0 0 1px rgba(116,245,226,.35); }
.cassette:focus-visible { outline: 2px solid var(--vfd); outline-offset: 2px; }

.grp { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.grp-keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.gsrc { grid-area: src; } .gtrans { grid-area: trans; } .gmodes { grid-area: modes; } .gdisp { grid-area: disp; }
.gt {
  display: flex; align-items: center; gap: 7px;
  font: 600 9.5px/1 var(--f-label); letter-spacing: .18em; color: var(--ink-dim); white-space: nowrap;
}
.gt::before, .gt::after { content: ""; flex: 1 1 8px; min-width: 8px; height: 5px; border-top: 1px solid var(--ink-faint); }
.gt::before { border-left: 1px solid var(--ink-faint); }
.gt::after { border-right: 1px solid var(--ink-faint); }

.ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lbl { font: 600 9px/1 var(--f-label); letter-spacing: .14em; color: var(--ink-dim); white-space: nowrap; }
.key {
  --acc-k: var(--acc);
  position: relative; box-sizing: border-box;
  min-width: 50px; height: 36px; padding: 0 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border-radius: 4px; border: 1px solid #0c0d0e; cursor: pointer;
  background: linear-gradient(180deg, var(--key-hi) 0%, var(--key) 48%, var(--key-lo) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.16), 0 2px 0 #0e0f10, 0 4px 7px rgba(0,0,0,.45);
  color: var(--key-ink);
  font: 700 12px/1 var(--f-label); letter-spacing: .07em; white-space: nowrap;
  transition: transform .05s, box-shadow .05s;
  -webkit-tap-highlight-color: transparent;
}
.key svg { width: 16px; height: 16px; display: block; }
.key .c2 { font-size: 8.5px; letter-spacing: .1em; opacity: .62; font-weight: 600; }
.key:active, .key.down { transform: translateY(2px); box-shadow: inset 0 1px 3px rgba(0,0,0,.35), 0 0 0 #0e0f10, 0 1px 2px rgba(0,0,0,.5); }
.key:focus-visible { outline: 2px solid var(--vfd); outline-offset: 3px; }
.key:disabled { cursor: default; opacity: .45; }
.key .led {
  position: absolute; top: 4px; left: 5px; width: 5px; height: 5px; border-radius: 50%;
  background: #4c4442; box-shadow: inset 0 1px 1px rgba(0,0,0,.55);
}
.key[aria-pressed="true"] .led { background: var(--acc-k); box-shadow: 0 0 5px var(--acc-k), 0 0 1px var(--acc-k); }
.key[aria-pressed="true"] { background: linear-gradient(180deg, #f2f3f4 0%, #d6d9dc 48%, #babec2 100%); }
.key.dark { background: linear-gradient(180deg, #55595d 0%, #404346 50%, #333639 100%); color: var(--ink); border-color: #0a0b0c; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.3), 0 2px 0 #0a0b0c, 0 4px 7px rgba(0,0,0,.45); }
.key.dark:active, .key.dark.down { box-shadow: inset 0 1px 3px rgba(0,0,0,.6), 0 0 0 #0a0b0c; }
.key.dark[aria-pressed="true"] { background: linear-gradient(180deg, #62666a 0%, #4a4d51 50%, #3b3e41 100%); }
.key.rec { color: var(--red); }
.key.small { min-width: 40px; height: 26px; padding: 0 8px; font-size: 11px; }
.key.small .led { top: 3px; left: 4px; width: 4px; height: 4px; }
.key.mode { min-width: 76px; }

/* VFD */
.vfd {
  grid-area: vfd; align-self: stretch; min-width: 0;
  display: grid; align-content: center; gap: 3px; padding: 8px 14px;
  background: radial-gradient(120% 140% at 50% 0%, #0a1f1c, var(--vfd-bg) 70%);
  border-radius: 6px; border: 1px solid #000;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08);
  font-family: var(--f-vfd); color: var(--vfd);
  text-shadow: 0 0 6px rgba(116,245,226,.55);
}
.vfd-ann { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10.5px; letter-spacing: .08em; }
.vfd-ann span { color: var(--vfd-off); text-shadow: none; }
.vfd-ann span.on { color: var(--vfd); text-shadow: 0 0 6px rgba(116,245,226,.55); }
.vfd-tc { font-size: clamp(26px, 3.4vw, 38px); line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vfd-tc small { font-size: .42em; letter-spacing: .1em; margin-left: .6em; opacity: .8; }
.vfd-st { font-size: 12px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; }

/* lab panel */
.panel {
  grid-area: panel; min-width: 0;
  border-radius: 7px; background: linear-gradient(180deg, var(--recess), #1c1e20);
  border: 1px solid #0c0d0e;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.07);
  padding: 10px 14px 14px;
  display: grid; gap: 12px;
}
.panel-head { display: flex; align-items: center; gap: 10px; font: 700 11px/1 var(--f-label); letter-spacing: .2em; color: var(--ink-dim); }
.panel-head .pname { color: var(--acc); text-shadow: 0 0 10px color-mix(in srgb, var(--acc) 40%, transparent); }
.panel-head .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--ink-faint), transparent); }
.panel-body { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: flex-end; min-height: 62px; }
.panel-empty { font: 500 14px/1.4 var(--f-body); color: var(--ink-dim); align-self: center; max-width: 60ch; }
.panel-empty kbd, .help kbd {
  font: 600 11px/1 var(--f-label); letter-spacing: .06em; padding: 3px 6px 2px; border-radius: 3px;
  background: linear-gradient(#e2e4e6, #b8bcc0); color: var(--key-ink); box-shadow: 0 1px 0 #0b0c0d;
}
.pgrp { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.pgrp .grp-keys { gap: 6px; }
.pgrp .key { min-width: 46px; padding: 0 8px; }

/* ---------- HELP ---------- */
.help { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.help-dim { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ring {
  position: fixed; border-radius: 8px; pointer-events: none;
  box-shadow: 0 0 0 2px var(--acc), 0 0 18px color-mix(in srgb, var(--acc) 55%, transparent);
  transition: all .25s ease;
}
.help-panel {
  pointer-events: auto;
  position: fixed; left: 50%; transform: translateX(-50%);
  width: min(600px, calc(100% - 32px)); max-height: min(68vh, 640px);
  box-sizing: border-box; overflow: auto;
  background: rgba(6, 7, 8, .94); color: var(--ink);
  border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6);
  padding: 18px 22px 16px;
  display: grid; gap: 10px;
}
.help-panel.at-top { top: calc(16px + env(safe-area-inset-top, 0px)); }
.help-panel.at-bottom { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.help-panel.at-mid { top: 50%; transform: translate(-50%, -50%); }
.help-panel.dock { max-height: 42vh; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 14px 16px 12px; gap: 8px; }
.help-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.help-topic { font: 22px/1 var(--f-osd); color: var(--acc); letter-spacing: .04em; text-transform: uppercase; }
.help-x { background: none; border: 0; color: var(--ink-dim); font: 28px/1 var(--f-osd); cursor: pointer; padding: 0 4px; }
.help-x:hover { color: var(--ink); }
.help-x:focus-visible, .hbtn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.help h2 { margin: 0; font: 30px/1 var(--f-osd); letter-spacing: .02em; text-transform: uppercase; color: #fff; text-wrap: balance; }
.help-body { font: 400 15.5px/1.55 var(--f-body); color: #d9dcdf; max-width: 62ch; }
.help-body p { margin: 0 0 .7em; }
.help-body p:last-child { margin-bottom: 0; }
.help-body em { color: var(--acc); font-style: italic; }
.help-body strong { color: #fff; font-weight: 600; }
.help-body ul { margin: 0 0 .7em; padding-left: 1.2em; }
.help-body li { margin: .15em 0; }
.help-body .small { font-size: 13.5px; color: var(--ink-dim); }
.help-body .formula { font: 20px/1.2 var(--f-osd); color: #fff; letter-spacing: .02em; margin: .2em 0 .7em; }
.help-body table { border-collapse: collapse; font-size: 14px; width: 100%; }
.help-body td { padding: 4px 8px 4px 0; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,.07); }
.help-body td:first-child { white-space: nowrap; }
.help-fig { margin: 2px 0 0; overflow-x: auto; }
.help-fig:empty { display: none; }
.help-fig svg { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; }
.help-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); display: block; }
.dots i.on { background: var(--acc); box-shadow: 0 0 6px var(--acc); }
.hnav { display: flex; gap: 8px; }
.hbtn {
  font: 600 13px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase;
  padding: 9px 14px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,.25);
}
.hbtn.primary { background: var(--acc); color: #0b0c0d; border-color: var(--acc); }
.hbtn[disabled] { opacity: .3; cursor: default; }
/* figure ink */
.ft { font: 11px var(--f-label); letter-spacing: .06em; fill: #c9cdd1; }
.ft.b { font-weight: 700; fill: #fff; }
.ft.a { fill: var(--acc); }
.fa { fill: var(--acc); } .sa { stroke: var(--acc); }
.ff { fill: #e9ebec; } .sf { stroke: #e9ebec; }
.fd { fill: #5d6267; } .sd { stroke: #5d6267; }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.media-pool { position: fixed; left: -10px; top: -10px; width: 2px; height: 2px; opacity: 0; pointer-events: none; overflow: hidden; }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 1120px) {
  .deck {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top top" "src vfd trans" "modes modes disp" "panel panel panel";
  }
}
@media (max-width: 900px) {
  .deck {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "top top" "vfd vfd" "src trans" "modes modes" "panel panel" "disp disp";
  }
}
@media (max-width: 560px) {
  .room { padding-block: 12px 32px; }
  .monitor { padding: 10px 10px 0; border-radius: 12px 12px 6px 6px; }
  .monitor-foot { padding: 8px 4px 9px; }
  .bezel { padding: 7px; }
  .model { display: none; }
  .deck { padding: 12px 12px 16px; gap: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "vfd" "src" "trans" "modes" "panel" "disp"; }
  .cassette { flex-basis: 100%; max-width: none; }
  .gmodes .grp-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gmodes .ctl .key { width: 100%; min-width: 0; padding: 0 4px; }
  .help-body { font-size: 14.5px; }
  .help h2 { font-size: 26px; }
}
@media (max-width: 560px) and (orientation: portrait) and (min-height: 600px) {
  .monitor { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 14px 24px -6px rgba(0,0,0,.9); }
  .room { padding-block-start: 0; }
  .monitor { border-radius: 0 0 12px 12px; margin-inline: -16px; width: calc(100% + 32px); }
  .stand { display: none; }

<script>
(() => {
'use strict';

/* =========================================================================
   Videolab — web edition
   Original Processing version by Eduardo Morais (2013–2021)
   ========================================================================= */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const store = {
  get(k, d) { try { const v = localStorage.getItem('videolab:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('videolab:' + k, JSON.stringify(v)); } catch (e) {} }
};

const MODES = [
  { id: 'res',       key: 'RESOLUTION', title: 'RESOLUTION' },
  { id: 'fps',       key: 'FRAME RATE', title: 'FRAME RATE' },
  { id: 'aspect',    key: 'ASPECT',     title: 'ASPECT RATIO' },
  { id: 'interlace', key: 'INTERLACE',  title: 'INTERLACED SCANNING' },
  { id: 'sampling',  key: 'SAMPLING',   title: 'CHROMA SAMPLING' },
  { id: 'depth',     key: 'BIT DEPTH',  title: 'COLOUR DEPTH' }
];
const ACC = {};
const cssv = getComputedStyle(document.documentElement);
['intro', 'res', 'fps', 'aspect', 'interlace', 'sampling', 'depth'].forEach(k => ACC[k] = cssv.getPropertyValue('--a-' + k).trim());

const SPEEDS = [1 / 16, 1 / 8, 1 / 4, 1 / 2, 1, 2];
const SPEED_LBL = ['1/16', '1/8', '1/4', '1/2', '1', '2'];
const ZOOMS = [1, 2, 4, 8, 16];

const state = {
  lang: store.get('lang', (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en'),
  source: 'test', paused: false, speedIdx: 4, module: null, wide: store.get('wide', true),
  zoomIdx: 0, focus: { x: .5, y: .5 }, osd: true,
  res: { lines: 144, scaler: 'nearest' },
  fps: { rate: 12, shutter: 180 },
  aspect: { picture: '16:9', fit: 'fit', anamorphic: false, desqueeze: true },
  interlace: { scan: 'i', rate: 25, lines: 2 },
  sampling: { scheme: '420', y: true, c: true, exag: 2 },
  depth: { bits: 4, dither: false, gradient: false }
};

/* lab panels: radio groups (key + opts) and toggle groups (toggles) */
const PANELS = {
  res: [
    { id: 'res-lines', key: 'lines', title: 'LINES · VERTICAL RESOLUTION', opts: [[2160, '2160', 'UHD'], [1080, '1080', 'FULL HD'], [720, '720', 'HD'], [576, '576', 'SD'], [288, '288', 'CIF'], [144, '144', 'QCIF'], [72, '72', ''], [36, '36', '']] },
    { id: 'res-scaler', key: 'scaler', title: 'SCALING', opts: [['nearest', 'NEAREST'], ['smooth', 'BILINEAR']] }
  ],
  fps: [
    { id: 'fps-rate', key: 'rate', title: 'FRAMES PER SECOND', opts: [[60, '60'], [50, '50'], [30, '30'], [25, '25'], [24, '24'], [12, '12'], [6, '6'], [2, '2']] },
    { id: 'fps-shutter', key: 'shutter', title: 'SHUTTER ANGLE', opts: [[360, '360°'], [180, '180°'], [45, '45°']] }
  ],
  aspect: [
    { id: 'aspect-picture', key: 'picture', title: 'PICTURE ASPECT', opts: [['4:3', '4:3', '1.33'], ['16:9', '16:9', '1.78'], ['1.85', '1.85', 'FLAT'], ['2.39', '2.39', 'SCOPE']] },
    { id: 'aspect-fit', key: 'fit', title: 'FIT TO SCREEN', opts: [['fit', 'BOX'], ['fill', 'CROP'], ['stretch', 'STRETCH']] },
    { id: 'aspect-anamorphic', title: 'ANAMORPHIC', toggles: [['anamorphic', 'SQUEEZE'], ['desqueeze', 'UNSQUEEZE']] }
  ],
  interlace: [
    { id: 'interlace-scan', key: 'scan', title: 'SCANNING', opts: [['p', 'PROG'], ['i', 'INTER'], ['field', 'FIELD'], ['bob', 'BOB']] },
    { id: 'interlace-rate', key: 'rate', title: 'FRAME RATE', opts: [[30, '30', 'NTSC'], [25, '25', 'PAL'], [12, '12', ''], [6, '6', ''], [2, '2', ''], [1, '1', '']] },
    { id: 'interlace-lines', key: 'lines', title: 'LINE SIZE', opts: [[1, '×1'], [2, '×2'], [4, '×4'], [8, '×8']] }
  ],
  sampling: [
    { id: 'sampling-scheme', key: 'scheme', title: 'CHROMA SUBSAMPLING', opts: [['444', '4:4:4'], ['422', '4:2:2'], ['420', '4:2:0'], ['411', '4:1:1']] },
    { id: 'sampling-display', title: 'DISPLAY', toggles: [['y', 'Y', 'LUMA'], ['c', 'CbCr', 'CHROMA']] },
    { id: 'sampling-exag', key: 'exag', title: 'EXAGGERATE', opts: [[1, '×1'], [2, '×2'], [4, '×4'], [8, '×8']] }
  ],
  depth: [
    { id: 'depth-bits', key: 'bits', title: 'BITS PER CHANNEL', opts: [[8, '8'], [6, '6'], [5, '5'], [4, '4'], [3, '3'], [2, '2'], [1, '1']] },
    { id: 'depth-options', title: 'OPTIONS', toggles: [['dither', 'DITHER'], ['gradient', 'GRADIENT']] }
  ]
};

/* ---------------------------------------------------------------------
   i18n
   --------------------------------------------------------------------- */
let L = { ui: { tips: {}, help: { prev: 'Back', next: 'Next', done: 'Done', close: 'Close' }, panel_empty: '' }, msg: {}, fig: {}, help: {} };
const i18nCache = {};
async function loadLang(lang) {
  if (!i18nCache[lang]) {
    const r = await fetch('i18n/' + lang + '.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    i18nCache[lang] = await r.json();
  }
  L = i18nCache[lang];
  state.lang = lang;
  document.documentElement.lang = lang === 'pt' ? 'pt-PT' : 'en';
  store.set('lang', lang);
  applyLang();
}
const msg = (k) => (L.msg && L.msg[k]) || k;
const fig = (k) => (L.fig && L.fig[k]) || k;

function applyLang() {
  $$('[data-tip]').forEach(el => {
    const t = L.ui.tips[el.dataset.tip];
    if (t) { el.title = t; el.setAttribute('aria-label', t); }
  });
  $$('[data-gtip]').forEach(el => { const t = L.ui.tips[el.dataset.gtip]; if (t) el.title = t; });
  $('#lang-cap').textContent = state.lang === 'pt' ? 'PT' : 'EN';
  $('#lang-c2').textContent = state.lang === 'pt' ? 'EN' : 'PT';
  $('#help-x').setAttribute('aria-label', L.ui.help.close);
  buildPanel();
  if (help.open) renderHelp();
}

/* ---------------------------------------------------------------------
   canvases
   --------------------------------------------------------------------- */
const scr = $('#screen');
const sctx = scr.getContext('2d');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });
const raster = document.createElement('canvas');
const rctx = raster.getContext('2d');
const hold = document.createElement('canvas');
const hctx = hold.getContext('2d');
let W = 0, H = 0, holdImg = null;

const screenWrap = $('#screen-wrap');
function fitScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(screenWrap.clientWidth * dpr));
  const h = Math.max(2, Math.round(screenWrap.clientHeight * dpr));
  if (scr.width !== w || scr.height !== h) { scr.width = w; scr.height = h; }
}
new ResizeObserver(fitScreen).observe(screenWrap);

/* ---------------------------------------------------------------------
   TEST SIGNAL  (960×540, drawn procedurally)
   --------------------------------------------------------------------- */
const test = (() => {
  const TW = 960, TH = 540;
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const x = c.getContext('2d');
  const st = document.createElement('canvas'); st.width = TW; st.height = TH;
  let built = false, lastT = null;
  const CX = 480, CY = 270, R = 236;

  function buildStatic() {
    const g = st.getContext('2d');
    g.fillStyle = '#4b4f54'; g.fillRect(0, 0, TW, TH);
    // square grid: 60 px cells (16 × 9) — squares stay square only at the right aspect
    g.strokeStyle = '#e4e6e8'; g.lineWidth = 2;
    g.beginPath();
    for (let gx = 60; gx < TW; gx += 60) { g.moveTo(gx, 0); g.lineTo(gx, TH); }
    for (let gy = 60; gy < TH; gy += 60) { g.moveTo(0, gy); g.lineTo(TW, gy); }
    g.stroke();
    // overscan / edge markers
    g.fillStyle = '#fff';
    const tri = (pts) => { g.beginPath(); g.moveTo(pts[0], pts[1]); g.lineTo(pts[2], pts[3]); g.lineTo(pts[4], pts[5]); g.closePath(); g.fill(); };
    tri([CX - 14, 0, CX + 14, 0, CX, 18]); tri([CX - 14, TH, CX + 14, TH, CX, TH - 18]);
    tri([0, CY - 14, 0, CY + 14, 18, CY]); tri([TW, CY - 14, TW, CY + 14, TW - 18, CY]);

    // left column: chroma lettering + skin tones
    const box = (bx, by, bw, bh, bg) => { g.fillStyle = bg; g.fillRect(bx, by, bw, bh); };
    box(36, 78, 168, 120, '#1838ff');
    box(36, 222, 168, 120, '#b0109a');
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '800 72px "Barlow Condensed", "Arial Narrow", sans-serif';
    g.fillStyle = '#ff2a1a'; g.fillText('RGB', 120, 140);
    g.fillStyle = '#ffe600'; g.fillText('YUV', 120, 284);
    ['#f3cfb3', '#c98c63', '#7a4a2a'].forEach((col, i) => box(36 + i * 56, 366, 56, 96, col));

    // right column: wheel housing, natural swatches, sky
    g.fillStyle = '#1c1e20'; g.fillRect(756, 72, 168, 132);
    const sw = ['#6fa8dc', '#4f7d2e', '#d8c38a', '#f08a4b', '#7b4fa8', '#2fb8c2'];
    sw.forEach((col, i) => box(756 + (i % 3) * 56, 222 + Math.floor(i / 3) * 60, 56, 60, col));
    const sky = g.createLinearGradient(0, 366, 0, 462);
    sky.addColorStop(0, '#163a78'); sky.addColorStop(1, '#a9d0f5');
    g.fillStyle = sky; g.fillRect(756, 366, 168, 96);

    // the circle
    g.save();
    g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.clip();
    g.fillStyle = '#26292c'; g.fillRect(CX - R, CY - R, R * 2, R * 2);
    // title band
    g.fillStyle = '#000'; g.fillRect(CX - R, 50, R * 2, 62);
    g.fillStyle = '#fff'; g.font = '700 44px "Barlow Condensed", "Arial Narrow", sans-serif';
    g.fillText('VIDEOLAB', CX, 83);
    // 75% colour bars
    const bars = ['#bfbfbf', '#bfbf00', '#00bfbf', '#00bf00', '#bf00bf', '#bf0000', '#0000bf'];
    const bw = (R * 2) / 7;
    bars.forEach((col, i) => { g.fillStyle = col; g.fillRect(CX - R + i * bw, 112, bw + 1, 110); });
    // 11-step grey scale
    for (let i = 0; i < 11; i++) { const v = Math.round(i * 25.5); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(CX - R + i * (R * 2 / 11), 222, R * 2 / 11 + 1, 48); }
    // smooth ramp
    const ramp = g.createLinearGradient(CX - R + 30, 0, CX + R - 30, 0);
    ramp.addColorStop(0, '#000'); ramp.addColorStop(1, '#fff');
    g.fillStyle = ramp; g.fillRect(CX - R, 270, R * 2, 42);
    // multiburst: 6 packets of vertical lines, coarse → fine
    g.fillStyle = '#000'; g.fillRect(CX - R, 312, R * 2, 60);
    const periods = [16, 10, 6, 4, 3, 2];
    const px0 = 270, pw = 62, pg = 9.6;
    periods.forEach((p, i) => {
      const x0 = Math.round(px0 + i * (pw + pg));
      const on = Math.ceil(p / 2);
      g.fillStyle = '#fff';
      for (let xx = x0; xx < x0 + pw; xx += p) g.fillRect(xx, 316, Math.min(on, x0 + pw - xx), 52);
    });
    // fine horizontal lines (1 px) and 2 px lines
    g.fillStyle = '#000'; g.fillRect(CX - R, 372, R * 2, 52);
    g.fillStyle = '#fff';
    for (let yy = 374; yy < 422; yy += 2) g.fillRect(CX - R, yy, R, 1);
    for (let yy = 374; yy < 422; yy += 4) g.fillRect(CX, yy, R, 2);
    // lower band
    g.fillStyle = '#000'; g.fillRect(CX - R, 424, R * 2, 90);
    g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = 3;
    g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.stroke();
    built = true; lastT = null;
  }

  function dynamic(t) {
    // wheel: 12 spokes, 2 rev/s → pattern repeats 24× per second
    const wx = 840, wy = 138, wr = 58, a0 = t * 2 * Math.PI * 2;
    x.fillStyle = '#0d0e0f'; x.beginPath(); x.arc(wx, wy, wr + 4, 0, Math.PI * 2); x.fill();
    x.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = a0 + i * Math.PI / 6;
      x.strokeStyle = i === 0 ? '#ff2a1a' : '#f2f2f2'; x.lineWidth = i === 0 ? 7 : 5;
      x.beginPath(); x.moveTo(wx + Math.cos(a) * 9, wy + Math.sin(a) * 9); x.lineTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr); x.stroke();
    }
    x.fillStyle = '#f2f2f2'; x.beginPath(); x.arc(wx, wy, 8, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#f2f2f2'; x.lineWidth = 3; x.beginPath(); x.arc(wx, wy, wr + 2, 0, Math.PI * 2); x.stroke();
    // running clock
    const ms = Math.max(0, t);
    const mm = Math.floor(ms / 60), ss = ms - mm * 60;
    x.fillStyle = '#fff'; x.font = '40px VT323, "Courier New", monospace';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(String(mm).padStart(2, '0') + ':' + ss.toFixed(3).padStart(6, '0'), CX, 446);
    // ball
    const bx = CX + 410 * Math.sin(2 * Math.PI * t / 2.4), by = 486, br = 24;
    const grd = x.createRadialGradient(bx - 8, by - 8, 2, bx, by, br);

    let gr = g.createLinearGradient(x0, 0, x1, 0);
    if (r) { gr.addColorStop(0, r[0]); gr.addColorStop(1, r[1]); }
    else ['#f00', '#ff0', '#0f0', '#0ff', '#00f', '#f0f', '#f00'].forEach((c, k) => gr.addColorStop(k / 6, c));
    g.fillStyle = gr; g.fillRect(x0, Math.round(y0 + i * rh), x1 - x0, Math.ceil(rh));
  });
}
function labDepth() {
  wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high';
  wctx.drawImage(srcFrame(), 0, 0, W, H);
  if (state.depth.gradient) drawGradientChart(wctx, W, H);
  const img = wctx.getImageData(0, 0, W, H), d = img.data;
  const bits = state.depth.bits, levels = 1 << bits, step = 255 / (levels - 1);
  if (bits < 8 || state.depth.dither) {
    const dith = state.depth.dither;
    for (let y = 0, j = 0; y < H; y++) {
      for (let x = 0; x < W; x++, j += 4) {
        const o = dith ? ((BAYER[(x & 3) + ((y & 3) << 2)] + .5) / 16 - .5) * step : 0;
        d[j] = Math.round((d[j] + o) / step) * step;
        d[j + 1] = Math.round((d[j + 1] + o) / step) * step;
        d[j + 2] = Math.round((d[j + 2] + o) / step) * step;
      }
    }
  }
  hctx.putImageData(img, 0, 0);
  drawToScreen(hold, W, H, W / H);
  const colours = Math.pow(levels, 3);
  osdInfo = [`${bits} BIT${bits > 1 ? 'S' : ''}/CHANNEL  ${levels} LEVELS`, `${bits * 3}-BIT RGB  ${colours.toLocaleString('en')} COLOURS`];
  if (state.depth.dither) osdInfo.push('<span>ORDERED DITHER 4×4</span>');
  vfdInfo = `DEPTH ${bits}BPC ${levels}LV`;
}

let lastOSD = '', lastTR = '', lastBL = '';

const tcEl = $('#tc'), vfdSt = $('#vfd-st');
const ann = { test: $('#an-test'), cam: $('#an-cam'), file: $('#an-file'), still: $('#an-still'), speed: $('#an-speed'), zoom: $('#an-zoom') };
let lastTC = '', lastVS = '';
function updateVFD() {
  let base = 25;
  if (state.module === 'fps') base = state.fps.rate;
  else if (state.module === 'interlace') base = state.interlace.rate;
  const t = Math.max(0, srcTime());
  const fr = Math.floor(t * base + 1e-6);
  const ff = fr % base, s = Math.floor(fr / base), m = Math.floor(s / 60), h = Math.floor(m / 60);
  const p = (v) => String(v).padStart(2, '0');
  const tc = `${p(h)}:${p(m % 60)}:${p(s % 60)}:${p(ff)}<small>${base}FPS</small>`;
  if (tc !== lastTC) { tcEl.innerHTML = tc; lastTC = tc; }
  const sp = state.source === 'camera' || state.source === 'image' ? '' : (state.speedIdx !== 4 ? ` ${SPEED_LBL[state.speedIdx]}X` : '');
  const vs = (srcReady() ? (state.paused ? 'STILL ' : 'PLAY ') : 'NO SIGNAL ') + (state.module ? vfdInfo : 'BYPASS') + sp;
  if (vs !== lastVS) { vfdSt.textContent = vs; lastVS = vs; }
  ann.test.classList.toggle('on', state.source === 'test');
  ann.cam.classList.toggle('on', state.source === 'camera');
  ann.file.classList.toggle('on', state.source === 'file' || state.source === 'image');
  ann.still.classList.toggle('on', state.paused);
  ann.speed.classList.toggle('on', state.speedIdx < 4 && state.source !== 'camera');
  ann.speed.textContent = state.speedIdx > 4 ? 'FAST' : 'SLOW';
  if (state.speedIdx > 4 && state.source !== 'camera') ann.speed.classList.add('on');
  ann.zoom.classList.toggle('on', ZOOMS[state.zoomIdx] > 1 && state.module !== 'aspect');
}

/* ---------------------------------------------------------------------
   MAIN LOOP
   --------------------------------------------------------------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!state.paused) clock += dt * (state.source === 'camera' || state.source === 'image' ? 1 : SPEEDS[state.speedIdx]);
  try {
    if (srcReady()) {
      ensureWork();
      (LABS[state.module] || labPlain)();
    } else {
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.fillStyle = '#05070a'; sctx.fillRect(0, 0, scr.width, scr.height);
      osdInfo = []; vfdInfo = '';
    }
  } catch (e) { console.error(e); }
  updateOSD(); updateVFD();
  if (help.open) positionHelp();
  requestAnimationFrame(loop);
}

function buildPanel() {

  }
  PANELS[mod.id].forEach(gdef => {
    const grp = document.createElement('div'); grp.className = 'pgrp'; grp.dataset.help = gdef.id; grp.dataset.gtip = gdef.id;
    const t = L.ui.tips[gdef.id]; if (t) grp.title = t;
    const keys = document.createElement('div'); keys.className = 'grp-keys';
    const mk = (label, sub, pressed, onClick) => {
      const b = document.createElement('button'); b.className = 'key';

      });
    } else {
      gdef.toggles.forEach(([k, label, sub]) => {

function togglePause() {
  state.paused = !state.paused;
  if (state.source === 'file') { state.paused ? vid.pause() : vid.play().catch(() => {}); }
  if (state.source === 'camera') {
    if (state.paused && cam.videoWidth) { freeze.width = cam.videoWidth; freeze.height = cam.videoHeight; freeze.getContext('2d').drawImage(cam, 0, 0); frozen = true; }
    else frozen = false;
  }
  syncKeys();
}
function changeSpeed(dir) {
  if (state.source === 'camera' || state.source === 'image') return;
  state.speedIdx = clamp(state.speedIdx + dir, 0, SPEEDS.length - 1);
  vid.playbackRate = SPEEDS[state.speedIdx];
  syncKeys();
}
function cycleZoom(dir = 1) {
  if (state.module === 'aspect') return;
  state.zoomIdx = (state.zoomIdx + dir + ZOOMS.length) % ZOOMS.length;
  syncKeys();
}
function setWide(w) { state.wide = w; store.set('wide', w); syncKeys(); }

async function snapshot() {
  const blob = await new Promise(r => scr.toBlob(r, 'image/png'));
  if (!blob) return;
  const name = `videolab-${state.module || 'bypass'}-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.png`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); showMsg(msg('snap_t'), name, 2500); }
    catch (e) { if (e && e.code !== 'declined') showMsg(msg('snap_fail_t'), msg('snap_fail'), 5000); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  showMsg(msg('snap_t'), name, 2500);
}

/* screen: click to aim the zoom, drag to pan, double-click to toggle ×4 */
let drag = null;
function screenToImage(e) {
  if (!view) return null;
  const r = scr.getBoundingClientRect(), k = scr.width / r.width;
  const px = (e.clientX - r.left) * k, py = (e.clientY - r.top) * k;
  return { x: (view.sx + (px - view.cx) / view.cw * view.sw) / view.iw, y: (view.sy + (py - view.cy) / view.ch * view.sh) / view.ih };
}
screenWrap.addEventListener('pointerdown', e => {
  if (!view) return;
  drag = { x: e.clientX, y: e.clientY, moved: false };
  screenWrap.setPointerCapture(e.pointerId);
});
screenWrap.addEventListener('pointermove', e => {
  if (!drag || !view) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; screenWrap.classList.add('dragging');
  const r = scr.getBoundingClientRect(), k = scr.width / r.width;
  state.focus.x = clamp(state.focus.x - dx * k / view.cw * (view.sw / view.iw), 0, 1);
  state.focus.y = clamp(state.focus.y - dy * k / view.ch * (view.sh / view.ih), 0, 1);
  drag.x = e.clientX; drag.y = e.clientY;
});
screenWrap.addEventListener('pointerup', e => {
  screenWrap.classList.remove('dragging');
  if (drag && !drag.moved) {
    const p = screenToImage(e);
    if (p && p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1) {
      state.focus = { x: p.x, y: p.y };
      aimAt = performance.now();
    }
  }
  drag = null;
});
screenWrap.addEventListener('dblclick', e => {
  if (state.module === 'aspect') return;
  const p = screenToImage(e);
  if (p) state.focus = { x: clamp(p.x, 0, 1), y: clamp(p.y, 0, 1) };
  state.zoomIdx = ZOOMS[state.zoomIdx] > 1 ? 0 : 2;
  syncKeys();
});
screenWrap.addEventListener('wheel', e => {
  if (state.module === 'aspect' || !view) return;
  e.preventDefault();
  const p = screenToImage(e);
  if (ZOOMS[state.zoomIdx] === 1 && p) state.focus = { x: clamp(p.x, 0, 1), y: clamp(p.y, 0, 1) };
  state.zoomIdx = clamp(state.zoomIdx + (e.deltaY < 0 ? 1 : -1), 0, ZOOMS.length - 1);
  syncKeys();
}, { passive: false });

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (help.open) {
    if (k === 'ArrowRight' || k === ' ' || k === 'Enter') { if (k !== 'Enter' || e.target === document.body) { e.preventDefault(); helpStep(1); return; } }
    if (k === 'ArrowLeft') { e.preventDefault(); helpStep(-1); return; }
    if (k === 'Escape') { e.preventDefault(); closeHelp(); return; }
  }
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'ArrowUp') { e.preventDefault(); changeSpeed(1); }
  else if (k === 'ArrowDown') { e.preventDefault(); changeSpeed(-1); }
  else if (k === 'Escape') setModule(null);
  else if (k >= '1' && k <= '6') setModule(MODES[+k - 1].id === state.module ? null : MODES[+k - 1].id);
  else if (k === '0') setModule(null);
  else if (k === 'z' || k === 'Z') cycleZoom(e.shiftKey ? -1 : 1);
  else if (k === 'o' || k === 'O') $('#k-osd').click();
  else if (k === 'S' && e.shiftKey) snapshot();
  else if (k === 'm' || k === 'M') setWide(!state.wide);
  else if (k === 'l' || k === 'L') $('#k-lang').click();
  else if (k === 'h' || k === 'H' || k === '?' || k === 'F1') { e.preventDefault(); openHelp(state.module || 'intro'); }
});
// press feedback for keyboard activation
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('.key'); if (b) b.classList.add('down'); });
document.addEventListener('pointerup', () => $$('.key.down').forEach(b => b.classList.remove('down')));

/* ---------------------------------------------------------------------
   HELP / TUTORIALS
   --------------------------------------------------------------------- */
const help = { open: false, topic: 'intro', page: 0, scrolled: false };
const helpEl = $('#help'), helpPanel = $('#help-panel');
function openHelp(topic, page = 0, scroll = true) {
  if (!L.help || !L.help[topic]) { showMsg(msg('help_missing_t') || 'HELP', msg('help_missing') || '', 6000); return; }
  help.open = true; help.topic = topic; help.page = page; help.scrolled = !scroll;
  store.set('seen-' + topic, true);
  helpEl.hidden = false;
  renderHelp();
}
function closeHelp() { help.open = false; helpEl.hidden = true; $('#help-holes').innerHTML = ''; $('#help-rings').innerHTML = ''; }
function helpStep(d) {
  const n = L.help[help.topic].pages.length;
  const p = help.page + d;
  if (p >= n) { closeHelp(); return; }
  if (p < 0) return;
  help.page = p; help.scrolled = false; renderHelp();
}
$('#help-x').addEventListener('click', closeHelp);
$('#help-prev').addEventListener('click', () => helpStep(-1));
$('#help-next').addEventListener('click', () => helpStep(1));

function renderHelp() {
  const T = L.help[help.topic]; if (!T) return;
  const pg = T.pages[help.page];
  helpEl.style.setProperty('--acc', ACC[help.topic] || ACC.intro);
  $('#help-topic').textContent = T.label;
  $('#help-title').textContent = pg.title;
  $('#help-body').innerHTML = pg.body;
  $('#help-fig').innerHTML = pg.figure && FIG[pg.figure] ? FIG[pg.figure]() : '';
  $('#help-dots').innerHTML = T.pages.map((_, i) => `<i class="${i === help.page ? 'on' : ''}"></i>`).join('');
  const prev = $('#help-prev'), next = $('#help-next');
  prev.textContent = L.ui.help.prev; prev.disabled = help.page === 0;
  next.textContent = help.page === T.pages.length - 1 ? L.ui.help.done : L.ui.help.next;
  helpPanel.scrollTop = 0;
  positionHelp(true);
}
function positionHelp(initial) {
  const pg = L.help[help.topic] && L.help[help.topic].pages[help.page]; if (!pg) return;
  const targets = (pg.targets || []).flatMap(n => $$(`[data-help="${n}"]`)).filter(el => el.offsetParent !== null);
  const mon = $('#monitor');
  const sticky = getComputedStyle(mon).position === 'sticky';
  helpPanel.classList.toggle('dock', sticky && targets.length > 0);
  if (initial && !help.scrolled && targets.length) {
    help.scrolled = true;
    const first = targets.find(t => t.dataset.help !== 'screen' && !mon.contains(t)) || targets[0];
    const r = first.getBoundingClientRect();
    if (sticky) {
      const top = mon.offsetHeight + 10;
      const bottom = innerHeight - helpPanel.offsetHeight - 16;
      if (!mon.contains(first) && (r.top < top || r.bottom > bottom)) window.scrollBy({ top: r.top - top, behavior: 'auto' });
    } else if (r.top < 0 || r.bottom > innerHeight) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const pad = 6;
  const rects = targets.map(el => { const r = el.getBoundingClientRect(); return { x: r.left - pad, y: r.top - pad, w: r.width + pad * 2, h: r.height + pad * 2 }; });
  const key = JSON.stringify(rects.map(r => [r.x | 0, r.y | 0, r.w | 0, r.h | 0]));
  if (key !== positionHelp.key || initial) {
    positionHelp.key = key;
    $('#help-holes').innerHTML = rects.map(r => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="8" fill="#000"/>`).join('');
    const rings = $('#help-rings');
    while (rings.children.length < rects.length) { const d = document.createElement('div'); d.className = 'ring'; rings.append(d); }
    while (rings.children.length > rects.length) rings.lastChild.remove();
    rects.forEach((r, i) => Object.assign(rings.children[i].style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }));
    // place the card where it hides the fewest highlighted controls
    let pos = 'at-mid';
    if (sticky && rects.length) pos = 'at-bottom';
    else if (rects.length) {
      const ph = helpPanel.offsetHeight + 24;
      const coverTop = rects.some(r => r.y < ph && r.y + r.h > 0 && !(r.h > innerHeight * .5));
      const coverBot = rects.some(r => r.y + r.h > innerHeight - ph && r.y < innerHeight && !(r.h > innerHeight * .5));
      const onlyScreen = targets.every(t => t.dataset.help === 'screen');
      pos = onlyScreen ? 'at-bottom' : (!coverTop ? 'at-top' : (!coverBot ? 'at-bottom' : 'at-top'));
      if (!onlyScreen && coverTop && coverBot) {
        const cy = rects.reduce((a, r) => a + r.y + r.h / 2, 0) / rects.length;
        pos = cy > innerHeight / 2 ? 'at-top' : 'at-bottom';
      }
    }
    helpPanel.classList.remove('at-top', 'at-bottom', 'at-mid');
    helpPanel.classList.add(pos);
  }
}
window.addEventListener('resize', () => { if (help.open) positionHelp(true); });

/* ---------------------------------------------------------------------
   TUTORIAL FIGURES (inline SVG)
   --------------------------------------------------------------------- */
const svg = (vb, body, label) => `<svg viewBox="${vb}" role="img" aria-label="${label || ''}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const FIG = {
  resolution() {
    const f = [['UHD 3840×2160', 3840, 2160], ['FULL HD 1920×1080', 1920, 1080], ['HD 1280×720', 1280, 720], ['SD 720×576', 720, 576]];
    const s = 440 / 3840; let o = '';
    f.forEach(([l, w, h], i) => {
      const rw = w * s, rh = h * s;
      o += `<rect x="10" y="10" width="${rw}" height="${rh}" fill="none" class="sa" stroke-width="${i ? 1.5 : 2}" opacity="${1 - i * .17}"/>`;
      o += `<text x="${10 + rw - 6}" y="${10 + rh - 7}" text-anchor="end" class="ft${i ? '' : ' a'}">${l}</text>`;
    });
    o += `<text x="455" y="${10 + 2160 * s}" text-anchor="end" class="ft" dy="16">${fig('scale_note')}</text>`;
    return svg(`0 0 460 ${2160 * s + 34}`, o, fig('resolution'));
  },
  framerate() {
    const rows = [[24, '24 fps'], [25, '25 fps'], [30, '30 fps'], [60, '60 fps']];
    const x0 = 70, span = 370, T = .25; let o = '';
    rows.forEach(([r, l], i) => {
      const y = 22 + i * 28;
      o += `<text x="0" y="${y + 4}" class="ft b">${l}</text><line x1="${x0}" x2="${x0 + span}" y1="${y}" y2="${y}" class="sd" stroke-width="1"/>`;
      for (let k = 0; k / r <= T + 1e-9; k++) o += `<circle cx="${x0 + (k / r) / T * span}" cy="${y}" r="3.6" class="fa"/>`;
    });
    for (let ms = 0; ms <= 250; ms += 50) { const x = x0 + ms / 250 * span; o += `<line x1="${x}" x2="${x}" y1="128" y2="134" class="sf"/><text x="${x}" y="148" text-anchor="middle" class="ft">${ms} ms</text>`; }
    return svg('0 0 460 156', o, fig('framerate'));
  },
  shutter() {
    const rows = [[360, '360°'], [180, '180°'], [45, '45°']];
    const x0 = 60, fw = 90; let o = '';
    rows.forEach(([a, l], i) => {
      const y = 12 + i * 34;
      o += `<text x="0" y="${y + 15}" class="ft b">${l}</text>`;
      for (let k = 0; k < 4; k++) {
        o += `<rect x="${x0 + k * fw}" y="${y}" width="${fw - 4}" height="22" fill="none" class="sd"/>`;
        o += `<rect x="${x0 + k * fw}" y="${y}" width="${(fw - 4) * a / 360}" height="22" class="fa" opacity=".85"/>`;
      }
    });
    o += `<text x="${x0}" y="122" class="ft">${fig('exposure')}</text>`;
    return svg('0 0 460 130', o, fig('shutter'));
  },
  aspect() {
    const h = 120, cx = 230, top = 14;
    const list = [['2.39:1', 2.39], ['1.85:1', 1.85], ['16:9 · 1.78', 16 / 9], ['4:3 · 1.33', 4 / 3]];
    let o = '';
    list.forEach(([l, r], i) => {
      const w = h * r;
      o += `<rect x="${cx - w / 2}" y="${top}" width="${w}" height="${h}" fill="none" class="${i === 2 ? 'sa' : 'sf'}" stroke-width="${i === 2 ? 2 : 1.2}" opacity="${i === 2 ? 1 : .55 + i * .12}"/>`;
      o += `<text x="${cx + w / 2 - 5}" y="${top + 16 + i * 15}" text-anchor="end" class="ft${i === 2 ? ' a' : ''}">${l}</text>`;
    });
    return svg('0 0 460 148', o, fig('aspect'));
  },
  fitting() {
    const panel = (x, mon, pic, mode, label) => {
      const mw = mon > 1.5 ? 96 : 76, mh = mon > 1.5 ? 54 : 57;
      const my = 10 + (57 - mh) / 2;
      let pw, ph;
      if (mode === 'fit') { if (pic > mon) { pw = mw; ph = mw / pic; } else { ph = mh; pw = mh * pic; } }
      else if (mode === 'crop') { if (pic > mon) { ph = mh; pw = mh * pic; } else { pw = mw; ph = mw / pic; } }
      else { pw = mw; ph = mh; }
      const px = x + (100 - pw) / 2, py = my + (mh - ph) / 2;
      const id = 'c' + Math.round(x);
      const rx = (ph * .36) * (mode === 'stretch' ? (mon / pic) : 1), ry = ph * .36;
      return `<defs><clipPath id="${id}"><rect x="${x + (100 - mw) / 2}" y="${my}" width="${mw}" height="${mh}"/></clipPath></defs>
        <rect x="${x + (100 - mw) / 2}" y="${my}" width="${mw}" height="${mh}" fill="#000" class="sf" stroke-width="1.4"/>
        <g clip-path="url(#${id})"><rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="#30353a"/>
        <ellipse cx="${px + pw / 2}" cy="${py + ph / 2}" rx="${rx}" ry="${ry}" fill="none" class="sa" stroke-width="2"/></g>
        <text x="${x + 50}" y="88" text-anchor="middle" class="ft b">${label}</text>`;
    };
    return svg('0 0 460 96', panel(8, 4 / 3, 16 / 9, 'fit', fig('letterbox')) + panel(122, 16 / 9, 4 / 3, 'fit', fig('pillarbox')) + panel(236, 4 / 3, 16 / 9, 'crop', fig('crop')) + panel(350, 4 / 3, 16 / 9, 'stretch', fig('stretch')), fig('fitting'));
  },
  anamorphic() {
    const box = (x, w, h, sq, label, sub) => `<rect x="${x}" y="${12 + (68 - h) / 2}" width="${w}" height="${h}" fill="#30353a" class="sf" stroke-width="1.4"/>
      <ellipse cx="${x + w / 2}" cy="46" rx="${24 * sq}" ry="24" fill="none" class="sa" stroke-width="2.2"/>
      <text x="${x + w / 2}" y="100" text-anchor="middle" class="ft b">${label}</text><text x="${x + w / 2}" y="114" text-anchor="middle" class="ft">${sub}</text>`;
    const arrow = (x) => `<path d="M${x} 46h22m-6 -5 6 5-6 5" fill="none" class="sf" stroke-width="1.5"/>`;
    return svg('0 0 460 120', box(4, 120, 67.5, 1, fig('shoot'), '16:9') + arrow(134) + box(170, 90, 67.5, .75, fig('store'), '4:3 · 720×576') + arrow(272) + box(306, 120, 67.5, 1, fig('display'), '16:9'), fig('anamorphic'));
  },
  pixels() {
    const grid = (x, par, label, sub) => {
      let o = ''; const ph = 22, pw = 22 * par;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o += `<rect x="${x + c * pw}" y="${10 + r * ph}" width="${pw - 2}" height="${ph - 2}" class="${(r + c) % 2 ? 'fd' : 'fa'}" opacity="${(r + c) % 2 ? 1 : .8}"/>`;
      return o + `<text x="${x}" y="90" class="ft b">${label}</text><text x="${x}" y="104" class="ft">${sub}</text>`;
    };
    return svg('0 0 460 110', grid(8, 1, '1 : 1', fig('par_hd')) + grid(110, 12 / 11, '1.09 : 1', fig('par_sd43')) + grid(222, 16 / 11, '1.46 : 1', fig('par_sd169')) + grid(352, 10 / 11, '0.91 : 1', fig('par_ntsc')), fig('pixels'));
  },
  scanning() {
    let o = '';
    const scr = (x, label, inter) => {
      let s = `<rect x="${x}" y="8" width="200" height="112" fill="#000" class="sd"/>`;
      const n = 12;
      for (let i = 0; i < n; i++) {
        const order = inter ? (i < n / 2 ? i * 2 : (i - n / 2) * 2 + 1) : i;
        const y = 16 + order * 8.6;
        const isB = inter && i >= n / 2;
        s += `<line x1="${x + 10}" x2="${x + 190}" y1="${y}" y2="${y + 3}" class="${isB ? 'sf' : 'sa'}" stroke-width="2"/>`;
        if (i < n - 1) {
          const no = inter ? (i + 1 < n / 2 ? (i + 1) * 2 : (i + 1 - n / 2) * 2 + 1) : i + 1;
          if (!(inter && i === n / 2 - 1)) s += `<line x1="${x + 190}" x2="${x + 10}" y1="${y + 3}" y2="${16 + no * 8.6}" class="sd" stroke-width="1" stroke-dasharray="3 3"/>`;
        }
      }
      return s + `<text x="${x + 100}" y="138" text-anchor="middle" class="ft b">${label}</text>`;
    };
    o += scr(10, fig('progressive'), false) + scr(240, fig('interlaced'), true);
    return svg('0 0 450 146', o, fig('scanning'));
  },
  progressive() { return FIG._seq(false); },
  interlaced() { return FIG._seq(true); },
  _seq(inter) {
    const n = 6, bw = 66, gap = 8; let o = '';
    for (let i = 0; i < n; i++) {
      const x = 6 + i * (bw + gap), t = i * (inter ? 20 : 40);
      const bx = x + 14 + (t / 200) * (bw - 28) * 1.6, by = 42, br = 13;
      o += `<rect x="${x}" y="10" width="${bw}" height="${bw}" fill="#000" class="sf" stroke-width="1.2"/>`;
      const hue = 50 - i * 8;
      if (!inter) o += `<circle cx="${Math.min(bx, x + bw - 14)}" cy="${by}" r="${br}" fill="hsl(${hue} 100% 55%)"/>`;
      else {
        const parity = i % 2;
        for (let ly = 12; ly < 10 + bw - 2; ly += 4) {
          const line = Math.floor((ly - 12) / 4);
          if (line % 2 !== parity) continue;
          const dyc = ly + 1 - by;
          if (Math.abs(dyc) < br) { const hw = Math.sqrt(br * br - dyc * dyc), cxx = Math.min(bx, x + bw - 14); o += `<rect x="${cxx - hw}" y="${ly}" width="${hw * 2}" height="2" fill="hsl(${hue} 100% 55%)"/>`; }
        }
      }
      o += `<text x="${x + bw / 2}" y="92" text-anchor="middle" class="ft${i ? '' : ' a'}">${t} ms</text>`;
      if (inter) o += `<text x="${x + bw / 2}" y="106" text-anchor="middle" class="ft">${i % 2 ? fig('field_b') : fig('field_a')}</text>`;
    }
    return svg(`0 0 450 ${inter ? 112 : 98}`, o, inter ? fig('interlaced') : fig('progressive'));
  },
  combing() {
    let o = `<rect x="10" y="8" width="200" height="110" fill="#000" class="sf"/><rect x="240" y="8" width="200" height="110" fill="#000" class="sf"/>`;
    const ball = (x0, xa, xb, cyy, r, wave) => {
      let s = '';
      for (let ly = 10; ly < 116; ly += 4) {
        const line = Math.floor((ly - 10) / 4), cx = wave ? (line % 2 ? xb : xa) : xa;
        const dy = ly + 1.5 - cyy;
        if (Math.abs(dy) < r) { const hw = Math.sqrt(r * r - dy * dy); s += `<rect x="${x0 + cx - hw}" y="${ly}" width="${hw * 2}" height="4" fill="hsl(46 100% 55%)"/>`; }
      }
      return s;
    };
    o += ball(10, 85, 125, 63, 34, true) + ball(240, 100, 100, 63, 34, false);
    o += `<text x="110" y="138" text-anchor="middle" class="ft b">${fig('weave')}</text><text x="340" y="138" text-anchor="middle" class="ft b">${fig('progressive')}</text>`;
    return svg('0 0 450 146', o, fig('combing'));
  },
  luma() {
    const bar = (y, label, w) => {
      let x = 80, o = `<text x="0" y="${y + 17}" class="ft b">${label}</text>`;
      [['#ff3b30', 'R'], ['#3ddc5a', 'G'], ['#3d6bff', 'B']].forEach(([c, n], i) => {
        const ww = w[i] * 360;
        o += `<rect x="${x}" y="${y}" width="${ww}" height="26" fill="${c}"/>`;
        if (ww > 26) o += `<text x="${x + ww / 2}" y="${y + 17}" text-anchor="middle" style="font:700 11px var(--f-label);fill:#000">${n} ${(w[i] * 100).toFixed(1)}%</text>`;
        x += ww;
      });
      return o;
    };
    return svg('0 0 460 80', bar(6, 'BT.601 · SD', [.299, .587, .114]) + bar(44, 'BT.709 · HD', [.2126, .7152, .0722]), fig('luma'));
  },
  sampling() {
    const cols = [['444', [1, 1], '100%'], ['422', [2, 1], '67%'], ['420', [2, 2], '50%'], ['411', [4, 1], '50%']];
    const pal = ['#ff4d6d', '#ffb703', '#3ddc97', '#4cc9f0', '#9b5de5', '#f15bb5', '#fee440', '#00bbf9'];
    const cs = 22; let o = '';
    cols.forEach(([n, [fx, fy], pct], gi) => {
      const x0 = 6 + gi * 114;
      for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
        const blk = Math.floor(r / fy) * (4 / fx) + Math.floor(c / fx);
        o += `<rect x="${x0 + c * cs}" y="${10 + r * cs}" width="${cs - 1}" height="${cs - 1}" fill="${pal[blk % pal.length]}"/>`;
        o += `<circle cx="${x0 + c * cs + cs / 2 - .5}" cy="${10 + r * cs + cs / 2 - .5}" r="3" fill="#fff" stroke="#000" stroke-width=".8"/>`;
      }
      o += `<text x="${x0 + 44}" y="72" text-anchor="middle" class="ft b">${n[0]}:${n[1]}:${n[2]}</text><text x="${x0 + 44}" y="86" text-anchor="middle" class="ft">${fig('data')} ${pct}</text>`;
    });
    o += `<circle cx="12" cy="102" r="3" fill="#fff" stroke="#000" stroke-width=".8"/><text x="20" y="106" class="ft">${fig('luma_sample')}</text><rect x="196" y="96" width="12" height="12" fill="#4cc9f0"/><text x="214" y="106" class="ft">${fig('chroma_sample')}</text>`;
    return svg('0 0 460 114', o, fig('sampling'));
  },
  bitdepth() {
    const rows = [1, 2, 3, 4, 8]; let o = '';
    rows.forEach((b, i) => {
      const y = 6 + i * 26, lv = 1 << b, x0 = 92, w = 360;
      o += `<text x="0" y="${y + 13}" class="ft b">${b} bit${b > 1 ? 's' : ''}</text><text x="86" y="${y + 13}" text-anchor="end" class="ft">${lv}</text>`;
      const cells = Math.min(lv, 64);
      for (let k = 0; k < cells; k++) {
        const v = Math.round((cells === 64 ? k / 63 : k / (lv - 1)) * 255);
        o += `<rect x="${x0 + k * w / cells}" y="${y}" width="${w / cells + .6}" height="18" fill="rgb(${v},${v},${v})"/>`;
      }
    });
    return svg('0 0 460 136', o, fig('bitdepth'));
  }
};

  const hash = (location.hash || '').slice(1);
